name: Notebook CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  equilibrium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: jupyter nbconvert --execute --to html notebooks/01_oxygen_hp.ipynb --output-dir=build
